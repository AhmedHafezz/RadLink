version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: RadLink.API/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=radlink;Username=postgres;Password=postgres
      - Redis__ConnectionString=redis:6379
      - AWS__ServiceUrl=http://minio:9000
      - AWS__BucketName=radlink-dicom
      - AWS__Region=us-east-1
      - AWS__AccessKey=minioadmin
      - AWS__SecretKey=minioadmin
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-256-bit-secret-key-here}
      - JWT__Issuer=${JWT_ISSUER:-radlink-api}
      - JWT__Audience=${JWT_AUDIENCE:-radlink-app}
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=radlink
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
